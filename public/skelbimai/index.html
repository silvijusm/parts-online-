:root{
  --bg:#f3f4f6; --surface:#ffffff; --ink:#15192b; --muted:#5c6378; --line:#dfe2ea;
  --accent:#1f47d6; --accent-soft:#e3e9ff; --tag:#ffd84a; --tag-ink:#2b2300;

}

  --accent:#8ea6ff; --accent-soft:#1f2850; --tag:#ffd84a; --tag-ink:#2b2300;

  --accent:#8ea6ff; --accent-soft:#1f2850; --tag:#ffd84a; --tag-ink:#2b2300;
  --c-B:#8ea6ff; --c-P:#c79bf2; --c-A:#ff9a5c; --c-N:#4fd1a5; --c-D:#f0c14b; --c-V:#f472b6; --c-T:#5ec8f2; --c-G:#a3d65c; --c-K:#f87171; --c-F:#e879f9; --c-Z:#b6c2d4; color-scheme:dark}

.lead{color:var(--muted);max-width:62ch;margin:0}
.stats{display:flex;gap:22px;flex-wrap:wrap;margin-top:6px;font-variant-numeric:tabular-nums}
.stats b{font:750 26px/1 var(--display);display:block}
.stats span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:0 14px}
.search:focus-within{border-color:var(--accent)}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:500 16px var(--body);padding:12px 0;outline:none}
.search svg{flex:none;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:500 13px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:focus-visible,.site:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dc,var(--muted));flex:none}
.count{font:400 13px var(--mono);color:var(--muted);padding-top:16px}
.grid{columns:300px;column-gap:16px;padding-block:12px 48px}
.country{break-inside:avoid;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:16px;overflow:hidden}
.country h2{font:750 17px/1.2 var(--display);margin:0;padding:12px 14px 10px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.country h2 .flag{font-size:20px;line-height:1}
.country h2 small{margin-left:auto;font:400 12px var(--mono);color:var(--muted)}
.country ul{list-style:none;margin:0;padding:4px 0}
.site{display:flex;align-items:center;gap:10px;padding:6px 14px;color:var(--ink);text-decoration:none;min-width:0}
.site:hover{background:var(--accent-soft)}
.country li{display:flex;align-items:center}
.country li .site{flex:1;padding-right:6px}
.star{flex:none;border:0;background:transparent;color:var(--muted);font-size:17px;line-height:1;padding:6px 12px 6px 4px;cursor:pointer;opacity:.45}
.star:hover,.star:focus-visible{opacity:1;color:var(--ink)}
.star[aria-pressed="true"]{opacity:1;color:#e0a100}
.pop{font:600 10px var(--body);letter-spacing:.06em;text-transform:uppercase;background:var(--tag);color:var(--tag-ink);border-radius:4px;padding:1px 5px;flex:none}
.chip .n{font:400 11px var(--mono);opacity:.7}
.site .dom{font:500 14px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.site .cat{font:500 11px var(--body);color:var(--cc);border:1px solid currentColor;border-radius:4px;padding:1px 6px;white-space:nowrap;flex:none}
.site .note{color:var(--muted);font:400 12px var(--body);white-space:nowrap}
.empty{padding:40px 0;color:var(--muted)}
.suggest{border-top:1px solid var(--line);padding-block:28px;display:grid;gap:14px;max-width:760px}
.suggest h2{font:750 24px/1.15 var(--display);margin:0}
.suggest p{margin:0;color:var(--muted)}
.sform{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
.sform label{display:grid;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.sform input,.sform select{width:100%;min-width:0;font:400 15px var(--body);color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:9px 10px}
.sform input:focus,.sform select:focus{outline:none;border-color:var(--accent)}
.sform .wide{grid-column:1/-1}
.btn{font:600 15px var(--body);background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:11px 18px;cursor:pointer;justify-self:start}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.totop:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.smsg{font-size:14px;min-height:1.2em}
.smsg.ok{color:var(--c-N)}.smsg.err{color:var(--c-K)}
.slist h3{font:600 14px var(--body);margin:6px 0}
.slist ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.slist li{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;font-size:13px;color:var(--muted)}
.slist li b{font:500 14px var(--mono);color:var(--ink);overflow-wrap:anywhere}
.totop{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:6;font:600 13px var(--body);background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:10px 14px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.18)}

.adlabel{font:500 11px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
footer{border-top:1px solid var(--line);padding-block:20px 40px;color:var(--muted);font-size:13px}

.langs{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.sharemenu{position:absolute;z-index:8;top:calc(100% + 6px);left:0;min-width:200px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.16);padding:6px;display:grid}

.lang select{border:0;background:transparent;color:var(--ink);font:500 14px var(--body);padding:7px 4px;cursor:pointer;outline:none}

    <div class="slist" id="sList"></div>
  </section>
  <footer data-t="footer"></footer>
</div>

const POP=new Set(CLASSIFIEDS_POP);

const DATA=CLASSIFIEDS;

const flagOf=c=>c==="INT"?"🌐":String.fromCodePoint(...[...c].map(ch=>0x1F1E6+ch.charCodeAt(0)-65));
const countries=DATA.map(([code,r,...s])=>({code,r,flag:flagOf(code),sites:s.map(x=>{const[d,c,n]=x.split(":");return{d,c,n:n||""}})}));
const fold=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const nameCache={};
function cname(code,lang){
  if(code==="INT")return L[lang].R[0];
  const k=lang+code;if(k in nameCache)return nameCache[k];
  let n=code;try{n=new Intl.DisplayNames([lang],{type:"region"}).of(code)||code}catch(e){}
  return nameCache[k]=n;
}
document.getElementById("sSites").textContent=new Set(countries.flatMap(c=>c.sites.map(s=>s.d))).size;
document.getElementById("sCountries").textContent=countries.filter(c=>c.r>0).length;

const urlLang=(()=>{try{const l=new URLSearchParams(location.search).get("lang");return l&&L[l]?l:""}catch(e){return ""}})();
function pickLang(){
  if(urlLang)return urlLang;
  try{const s=localStorage.getItem("skelbimai-lang");if(s&&L[s])return s}catch(e){}
  for(const l of navigator.languages||[navigator.language||""]){const k=(l||"").slice(0,2).toLowerCase();if(L[k])return k}
  return "en";
}
function setLang(l){state.lang=l;try{localStorage.setItem("skelbimai-lang",l)}catch(e){}
  try{const u=new URL(location.href);u.searchParams.set("lang",l);history.replaceState(null,"",u.pathname+u.search+u.hash)}catch(e){}
  applyLang()}
let state={q:"",r:-1,c:"",lang:pickLang()};
let favs=new Set();try{favs=new Set(JSON.parse(localStorage.getItem("skelbimai-fav")||"[]"))}catch(e){}
function toggleFav(d){favs.has(d)?favs.delete(d):favs.add(d);try{localStorage.setItem("skelbimai-fav",JSON.stringify([...favs]))}catch(e){}render()}
try{const saved=JSON.parse(localStorage.getItem("skelbimai-f")||"null");if(saved)state={...state,r:saved.r??-1,c:saved.c??""}}catch(e){}
readHash();addEventListener("hashchange",()=>{readHash();render()});

const sel=document.getElementById("lang");
for(const[k,v]of Object.entries(L)){const o=document.createElement("option");o.value=k;o.textContent=v.name;sel.append(o)}
sel.onchange=()=>setLang(sel.value);

function shareUrl(){return location.origin+location.pathname+"?lang="+state.lang}
function openShare(open){shareMenu.hidden=!open;shareBtn.setAttribute("aria-expanded",open)}

const quick=document.getElementById("quickLang");quick.onclick=()=>setLang(state.lang==="en"?"lt":"en");

function applyLang(){
  const t=L[state.lang];sel.value=state.lang;
  document.documentElement.lang=state.lang;document.title=t.title;
  quick.textContent=state.lang==="en"?"LT versija":"EN version";
  document.getElementById("shareLbl").textContent=t.sh.share;document.getElementById("shCopy").textContent=t.sh.copy;document.getElementById("shMore").textContent=t.sh.more;quick.lang=state.lang==="en"?"lt":"en";
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=t[el.dataset.t]);
  const [a,b]=t.h1.split("{m}");const h=document.getElementById("h1");h.replaceChildren(a,Object.assign(document.createElement("mark"),{textContent:t.m}),b);
  document.getElementById("regCount").textContent=(t.R.length-1)+" "+t.regs;

function chip(label,pressed,on,color,num){const b=document.createElement("button");b.className="chip";b.type="button";b.setAttribute("aria-pressed",pressed);
  if(color){const d=document.createElement("span");d.className="dot";d.style.setProperty("--dc",color);b.append(d)}
  b.append(label);if(num!=null){const n=document.createElement("span");n.className="n";n.textContent=num;b.append(" ",n)}b.onclick=on;return b}
function renderChips(cnt={}){
  const t=L[state.lang];
  document.getElementById("regions").replaceChildren(chip(t.allR,state.r===-1,()=>set({r:-1})),...t.R.map((n,i)=>chip(n,state.r===i,()=>set({r:i}))));
  document.getElementById("cats").replaceChildren(chip(t.allT,state.c==="",()=>set({c:""}),null,cnt.all||0),chip("▲ "+t.pop,state.c==="TOP",()=>set({c:"TOP"}),null,cnt.TOP||0),chip("★ "+t.fav,state.c==="FAV",()=>set({c:"FAV"}),null,cnt.FAV||0),...CK.filter(k=>cnt[k]||state.c===k).map(k=>chip(t.C[CK.indexOf(k)],state.c===k,()=>set({c:k}),`var(--c-${k})`,cnt[k]||0)));
}
function set(p){state={...state,...p};try{localStorage.setItem("skelbimai-f",JSON.stringify({r:state.r,c:state.c}))}catch(e){}writeHash();render()}
function writeHash(){const h=[state.r>=0?"r"+state.r:"",state.c&&state.c!=="FAV"?"t"+state.c:""].filter(Boolean).join("-");try{history.replaceState(null,"",h?"#"+h:location.pathname+location.search)}catch(e){}}
function readHash(){const h=(location.hash||"").slice(1);if(!h)return;const p={r:-1,c:""};for(const part of h.split("-")){if(/^r\d$/.test(part)&&+part[1]<9)p.r=+part[1];else if(/^t(TOP|[A-Z])$/.test(part)&&(part.slice(1)==="TOP"||CK.includes(part.slice(1))))p.c=part.slice(1)}state={...state,...p}}
function render(){
  const t=L[state.lang],q=fold(state.q.trim()),grid=document.getElementById("grid");grid.replaceChildren();let n=0,cn=0;const cnt={all:0,FAV:0};
  for(const c of countries){
    if(state.r!==-1&&c.r!==state.r)continue;

    const pre=c.sites.filter(s=>!q||cm||fold(s.d+" "+s.n).includes(q));
    for(const s of pre){cnt.all++;cnt[s.c]=(cnt[s.c]||0)+1;if(favs.has(s.d))cnt.FAV++;if(POP.has(s.d))cnt.TOP=(cnt.TOP||0)+1}
    const sites=pre.filter(s=>!state.c||(state.c==="FAV"?favs.has(s.d):state.c==="TOP"?POP.has(s.d):s.c===state.c)).sort((a,b)=>POP.has(b.d)-POP.has(a.d));
    if(!sites.length)continue;n+=sites.length;cn++;
    const sec=document.createElement("section");sec.className="country";
    const h=document.createElement("h2");h.innerHTML=`<span class="flag" aria-hidden="true"></span><span></span><small></small>`;
    h.children[0].textContent=c.flag;h.children[1].textContent=name;h.children[2].textContent=sites.length;
    const ul=document.createElement("ul");
    for(const s of sites){const li=document.createElement("li");const a=document.createElement("a");a.className="site";a.href="/go?u="+encodeURIComponent("https://"+s.d)+"&s="+encodeURIComponent(s.d);a.target="_blank";a.rel="noopener sponsored";
      a.innerHTML=`<span class="dom"></span><span class="note"></span><span class="cat"></span>`;
      a.children[0].textContent=s.d;a.children[1].textContent=s.n;a.children[2].textContent=t.C[CK.indexOf(s.c)];a.children[2].style.setProperty("--cc",`var(--c-${s.c})`);if(POP.has(s.d)){const pb=document.createElement("span");pb.className="pop";pb.textContent="TOP";pb.title=t.pop;a.children[1].after(pb)}
      const st=document.createElement("button");st.type="button";st.className="star";st.setAttribute("aria-pressed",favs.has(s.d));st.title=t.fav;st.setAttribute("aria-label",t.fav+": "+s.d);st.textContent=favs.has(s.d)?"★":"☆";st.onclick=()=>toggleFav(s.d);
      li.append(a,st);ul.append(li)}
    sec.append(h,ul);grid.append(sec);
  }
  document.getElementById("count").textContent=n?t.count.replace("{n}",n).replace("{c}",cn):"";
  if(!n){const e=document.createElement("p");e.className="empty";e.textContent=t.empty;grid.append(e)}
  renderChips(cnt);
}
document.getElementById("q").addEventListener("input",e=>{state.q=e.target.value;render()});
const sug={db:null,uid:null,owner:false,mine:[],all:null,msg:"",ok:false};
function sugText(){
  const t=L[state.lang],x=t.s;
  document.getElementById("totop").textContent="↑ "+x.top;
  for(const[id,k]of[["sH","h"],["sLead","lead"],["lUrl","url"],["lCountry","country"],["lType","type"],["lNote","note"],["sSend","send"]])document.getElementById(id).textContent=x[k];
  const cs=document.getElementById("sCountry"),cv=cs.value;
  const opts=countries.filter(c=>c.r>0).map(c=>[c.code,cname(c.code,state.lang)]).sort((a,b)=>a[1].localeCompare(b[1],state.lang));
  cs.replaceChildren(new Option(x.other,"INT"),...opts.map(([c,n])=>new Option(n,c)));if(cv)cs.value=cv;else{const d=(navigator.language||"").slice(-2).toUpperCase();if(opts.some(o=>o[0]===d))cs.value=d}
  const ts=document.getElementById("sType"),tv=ts.value;ts.replaceChildren(...CK.map((k,i)=>new Option(t.C[i],k)));if(tv)ts.value=tv;
  renderSug();
}
function renderSug(){
  const x=L[state.lang].s,m=document.getElementById("sMsg");m.textContent=sug.msg?x[sug.msg]:"";m.className="smsg "+(sug.ok?"ok":sug.msg?"err":"");
  const box=document.getElementById("sList");box.replaceChildren();
  const list=(title,items)=>{const h=document.createElement("h3");h.textContent=title;const ul=document.createElement("ul");
    if(!items.length){const li=document.createElement("li");li.textContent=x.none;ul.append(li)}
    for(const it of items.slice().sort((a,b)=>(b.at||0)-(a.at||0))){const li=document.createElement("li");const b=document.createElement("b");b.textContent=it.url;
      const meta=document.createElement("span");meta.textContent=[cname(it.country||"INT",state.lang),L[state.lang].C[CK.indexOf(it.type)]||"",it.note||""].filter(Boolean).join(" · ");li.append(b,meta);ul.append(li)}
    box.append(h,ul)};
  if(sug.owner&&sug.all)list(x.all,sug.all);else if(sug.uid&&sug.mine.length)list(x.mine,sug.mine);
}
async function initSug(){
  const db=window.claude?.use?await window.claude.use("db").catch(()=>null):null;if(!db)return;
  const user=await window.claude.use("user").catch(()=>null);
  sug.db=db;sug.uid=user?await user.id().catch(()=>null):null;sug.owner=user?await user.isOwner().catch(()=>false):false;
  document.getElementById("suggest").hidden=false;sugText();
  const canW=user?await user.can("data.write").catch(()=>null):null;
  if(!sug.uid||canW===false){document.getElementById("sSend").disabled=true;sug.msg="noAccess";renderSug()}
  if(sug.uid){try{const d=await db.doc("suggestions/"+sug.uid).get();sug.mine=(d.data()?.items)||[]}catch(e){}}
  if(sug.owner){db.collection("suggestions").onSnapshot(q=>{sug.all=q.docs.flatMap(d=>d.data()?.items||[]);renderSug()},()=>{})}
  renderSug();
}
document.getElementById("sform").addEventListener("submit",async e=>{
  e.preventDefault();if(!sug.db||!sug.uid)return;
  let url=document.getElementById("sUrl").value.trim().replace(/^https?:\/\//i,"").replace(/^www\./i,"").replace(/\/$/,"");
  if(!/^[^\s\/]+\.[a-z]{2,}(\/\S*)?$/i.test(url)){sug.msg="bad";sug.ok=false;renderSug();return}
  const item={url,country:document.getElementById("sCountry").value,type:document.getElementById("sType").value,note:document.getElementById("sNote").value.trim().slice(0,200),at:Date.now()};
  const btn=document.getElementById("sSend");btn.disabled=true;
  try{const items=[...sug.mine,item].slice(-50);await sug.db.doc("suggestions/"+sug.uid).set({items});sug.mine=items;sug.msg="sent";sug.ok=true;document.getElementById("sUrl").value="";document.getElementById("sNote").value=""}
  catch(err){sug.ok=false;sug.msg=err&&err.code==="invalid_argument"?"noAccess":"bad";if(sug.msg==="noAccess"){renderSug();return}}
  btn.disabled=false;renderSug();
});
const toTop=document.getElementById("totop");toTop.onclick=()=>window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
addEventListener("scroll",()=>{toTop.hidden=scrollY<900},{passive:true});
addEventListener("keydown",e=>{if(e.key==="/"&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName||"")){e.preventDefault();document.getElementById("q").focus()}});
const _applyLang=applyLang;applyLang=function(){_applyLang();if(sug.db)sugText();else document.getElementById("totop").textContent="↑ "+L[state.lang].s.top};
applyLang();initSug();
// AdSense units, only when the server has both a client and a slot id configured.
fetch("/api/config").then(r=>r.ok?r.json():null).then(c=>{
  const a=c?.adsense;if(!a?.client||!a?.slot)return;
  for(const slot of document.querySelectorAll(".ad-slot")){slot.hidden=false;const ins=document.createElement("ins");ins.className="adsbygoogle";ins.style.display="block";
    Object.assign(ins.dataset,{adClient:a.client,adSlot:a.slot,adFormat:"auto",fullWidthResponsive:"true"});slot.append(ins);
    try{(window.adsbygoogle=window.adsbygoogle||[]).push({})}catch(e){}}
}).catch(()=>{});
